<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Output</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: #fff; color: #0f172a; }
  body.dark { background: #0b1628; color: #e2e8f0; }
  #out { margin: 0; padding: 14px 16px; white-space: pre-wrap; word-break: break-word; }
  .muted { color: #64748b; }
  .err { color: #b91c1c; }
  body.dark .err { color: #fca5a5; }
  table { border-collapse: collapse; margin: 6px 0 14px; font-size: 14px; }
  th, td { border: 1px solid #cbd5e1; padding: 4px 10px; text-align: left; }
  th { background: #f1f5f9; }
  body.dark th { background: #13233d; }
  body.dark th, body.dark td { border-color: #334155; }
</style>
</head>
<body>
<pre id="out"><span class="muted">Press Run to see the output.</span></pre>
<script src="runner.js?v=5513cadc72" data-engines="d1b07bd2d8"></script>
</body>
</html>
