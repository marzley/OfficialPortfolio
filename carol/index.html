<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Carol 💖</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#07050d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@500;700;900&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="dark">
<div id="fx" aria-hidden="true"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<header id="top">
  <div id="bar"><i></i></div>
  <div class="tb">
    <span id="chap"></span>
    <span class="tools">
      <button id="snd" title="Sound on/off" aria-label="Toggle sound">🔔</button>
      <button id="menu" title="Chapters" aria-label="Chapters">☰</button>
    </span>
  </div>
</header>

<main id="stage" aria-live="polite"></main>

<footer id="tick"></footer>

<div id="panel" hidden>
  <div class="panel-in">
    <h3>Jump to a chapter</h3>
    <div id="chapters"></div>
    <button class="btn alt" id="closePanel">Close</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
